name: PR checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality (types, lint, rules, dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint and Prettier (errors block, warnings are reported)
        run: node scripts/eslint-annotate.mjs

      - name: Unused or missing dependencies (depcheck)
        run: npx --yes depcheck@1.4.7

      - name: No tracking or analytics SDK
        run: node scripts/check-forbidden-deps.mjs

      - name: Expo project health (expo-doctor)
        run: npx expo-doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: 1

      - name: Expo SDK patch versions (reported, not blocking)
        run: |
          if ! npx expo install --check; then
            echo "::warning title=Expo versions::Some packages do not match the patch versions expected by the Expo SDK. Run: npx expo install --fix"
          fi

  security:
    name: Security (CVE, secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (critical blocks, others are reported)
        run: node scripts/audit-report.mjs

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx jest --ci

  bundle:
    name: Build JS bundle (Android, iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx expo export --platform android --platform ios --output-dir dist

  native-changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Compare with the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Without a usable base (new branch, forced history), build to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(package\.json|package-lock\.json|app\.config\.ts|eas\.json|assets/|\.github/workflows/pr-checks\.yml)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android build skipped::No native change: the JS bundle job covers this PR."
          fi

  android:
    name: Build Android app (debug)
    needs: native-changes
    # A job skipped by its condition counts as successful for the required status checks.
    if: needs.native-changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Cache is written on develop/main and read by pull requests.
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleDebug (arm64-v8a only)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
